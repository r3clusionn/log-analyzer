[package]
name = "logscan"
version = "0.1.0"
edition = "2021"
description = "Stream large access and application logs and report errors, traffic spikes, latency and timestamp anomalies."
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
